name: Miserudake
options:
  bundleIdPrefix: com.matthew0925
  deploymentTarget:
    iOS: "17.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.20.0
targets:
  Miserudake:
    type: application
    platform: iOS
    sources:
      - path: Miserudake
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: ShareExtension
        embed: true
    info:
      path: Miserudake/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: ミセルダケ
        NSCameraUsageDescription: 身分証などの書類を撮影してマスキングするために使用します。
        NSPhotoLibraryUsageDescription: カメラロールから書類の画像を選択するために使用します。
        NSPhotoLibraryAddUsageDescription: マスキング済みの画像を保存するために使用します。
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - miserudake
            CFBundleURLName: com.matthew0925.miserudake
    entitlements:
      path: Miserudake/Miserudake.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthew0925.miserudake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthew0925.miserudake
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MiserudakeTests
      gatherCoverageData: false
  MiserudakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MiserudakeTests
    dependencies:
      - target: Miserudake
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Miserudake.app/Miserudake
        BUNDLE_LOADER: $(TEST_HOST)
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Miserudake/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ミセルダケで隠す
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
          NSExtensionMainStoryboard: MainInterface
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthew0925.miserudake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthew0925.miserudake.ShareExtension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true

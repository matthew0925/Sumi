name: Sumi
options:
  bundleIdPrefix: com.matthew0925
  deploymentTarget:
    iOS: "17.0"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.20.0
targets:
  Sumi:
    type: application
    platform: iOS
    sources:
      - path: Sumi
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: ShareExtension
        embed: true
    info:
      path: Sumi/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Sumi
        NSCameraUsageDescription: 身分証などの書類を撮影してマスキングするために使用します。
        NSPhotoLibraryUsageDescription: カメラロールから書類の画像を選択するために使用します。
        NSPhotoLibraryAddUsageDescription: マスキング済みの画像を保存するために使用します。
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sumi
            CFBundleURLName: com.matthew0925.sumi
    entitlements:
      path: Sumi/Sumi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthew0925.sumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthew0925.sumi
        DEVELOPMENT_TEAM: XV92DHDWYL
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - SumiTests
      gatherCoverageData: false
  SumiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SumiTests
    dependencies:
      - target: Sumi
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sumi.app/Sumi
        BUNDLE_LOADER: $(TEST_HOST)
        DEVELOPMENT_TEAM: XV92DHDWYL
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sumi/Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sumiで隠す
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
          NSExtensionMainStoryboard: MainInterface
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.matthew0925.sumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthew0925.sumi.ShareExtension
        DEVELOPMENT_TEAM: XV92DHDWYL
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: true
